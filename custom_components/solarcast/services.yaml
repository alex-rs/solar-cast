get_forecast:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solarcast
    resolution:
      default: 60
      selector:
        select:
          options:
            - "15"
            - "60"
    layer:
      default: final
      selector:
        select:
          options:
            - final
            - hybrid
            - physics
            - physics_base
backfill:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solarcast
    days:
      default: 60
      selector:
        number:
          min: 1
          max: 60
    entity_id:
      selector:
        entity:
          domain: sensor
retrain:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solarcast
upload_horizon:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solarcast
    horizon:
      required: true
      selector:
        text:
          multiline: true
clear_horizon:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solarcast
set_telemetry:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solarcast
    period_start:
      required: true
      selector:
        datetime:
    energy_wh:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: Wh
    period_min:
      default: 15
      selector:
        select:
          options:
            - "15"
            - "60"
    curtailed:
      default: false
      selector:
        boolean:
delete_telemetry:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solarcast
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
