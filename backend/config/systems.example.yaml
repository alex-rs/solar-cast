# Optional static system definitions, upserted at startup.
# Copy to systems.yaml and mount it into the container.
systems:
  - system_id: home
    name: Home
    lat: 44.8125
    lon: 20.4612
    inverter_kw: 5.0
    system_loss: 0.10
    gamma_pdc: -0.004
    # Keep forecasting from telemetry when the weather API is unreachable.
    local_fallback: true
    planes:
      - dec: 30
        az: 0
        kwp: 5.0
