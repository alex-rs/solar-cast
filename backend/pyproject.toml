[project]
name = "localsolarcast"
version = "1.2.0"
description = "Self-hosted PV forecasting engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pvlib>=0.11,<0.15",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "timezonefinder>=6.4.1",
    "apscheduler>=3.10,<4.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*", "config*"]
